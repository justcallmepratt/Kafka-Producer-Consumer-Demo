spring.application.name=${APP_NAME:demo}

# Server Configuration
server.port=${PORT:8080}

# MongoDB Configuration (12-Factor: Config in Environment)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:kafka_demo}

# Kafka Configuration (12-Factor: Config in Environment)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:demo-group}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Topic
kafka.topic.name=${KAFKA_TOPIC_NAME:demo-topic}

# Actuator for health checks (12-Factor: Admin processes)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.kafka.enabled=true
management.health.mongo.enabled=true

# Logging (12-Factor: Logs as event streams)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.example.demo=${APP_LOG_LEVEL:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
