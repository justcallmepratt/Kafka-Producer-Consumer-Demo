version: 2
updates:
  # GitHub Actions — keep action versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Maven — the parent pom and all four modules
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns: ["org.springframework.boot:*"]

  # Docker — base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
