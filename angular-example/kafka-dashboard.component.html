<div class="kafka-dashboard">
  <h1>📨 Kafka Producer & Consumer Demo</h1>

  <div class="dashboard-grid">
    <!-- Producer Section -->
    <div class="card producer-card">
      <h2>🚀 Producer</h2>
      
      <!-- Status Messages -->
      <div class="alert alert-success" *ngIf="success">
        {{ success }}
      </div>
      <div class="alert alert-error" *ngIf="error">
        {{ error }}
      </div>

      <!-- Producer Form -->
      <form [formGroup]="messageForm" (ngSubmit)="sendMessage()">
        <div class="form-group">
          <label for="key">Message Key (Optional):</label>
          <input 
            type="text" 
            id="key" 
            formControlName="key"
            placeholder="Enter message key..."
            class="form-control">
        </div>

        <div class="form-group">
          <label for="message">Message: *</label>
          <textarea 
            id="message" 
            formControlName="message"
            placeholder="Enter your message here..."
            rows="4"
            class="form-control"
            [class.invalid]="messageForm.get('message')?.invalid && messageForm.get('message')?.touched">
          </textarea>
          <div class="error-message" 
               *ngIf="messageForm.get('message')?.invalid && messageForm.get('message')?.touched">
            Message is required
          </div>
        </div>

        <div class="button-group">
          <button 
            type="submit" 
            class="btn btn-primary"
            [disabled]="messageForm.invalid || loading">
            <span *ngIf="!loading">Send Message</span>
            <span *ngIf="loading">Sending...</span>
          </button>
          <button 
            type="button" 
            class="btn btn-secondary"
            (click)="messageForm.reset()">
            Clear Form
          </button>
        </div>
      </form>
    </div>

    <!-- Consumer Section -->
    <div class="card consumer-card">
      <h2>📥 Consumer</h2>

      <div class="button-group">
        <button 
          class="btn btn-primary"
          (click)="loadMessages()">
          🔄 Refresh Messages
        </button>
        <button 
          class="btn btn-danger"
          (click)="clearMessages()">
          🗑️ Clear All
        </button>
      </div>

      <div class="stats">
        <strong>Total Messages:</strong> {{ messages.length }}
      </div>

      <!-- Messages List -->
      <div class="messages-container">
        <div class="no-messages" *ngIf="messages.length === 0">
          No messages consumed yet
        </div>

        <div class="message-item" *ngFor="let message of messages">
          <div class="message-content">
            {{ message.content }}
          </div>
          <div class="message-meta">
            <span *ngIf="message.key" class="message-key">
              🔑 Key: {{ message.key }}
            </span>
            <span class="message-timestamp">
              🕐 {{ formatTimestamp(message.timestamp) }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
