spring.application.name=${APP_NAME:demo}

# Server Configuration
server.port=${PORT:8080}

# PostgreSQL Configuration (12-Factor: Config in Environment)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
# Small pool: managed Postgres poolers cap connections on free plans.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:2}
# "update" creates the kafka_demo_messages table for local use. On a shared or
# managed database create the table yourself and set JPA_DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
# Schema holding the table. Keep it out of "public" on Supabase, which serves that schema over its API.
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.open-in-view=false

# Kafka Configuration (12-Factor: Config in Environment)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:demo-group}
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Topic
kafka.topic.name=${KAFKA_TOPIC_NAME:demo-topic}

# Actuator for health checks (12-Factor: Admin processes)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.kafka.enabled=true
management.health.db.enabled=true

# Logging (12-Factor: Logs as event streams)
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.example.demo=${APP_LOG_LEVEL:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
